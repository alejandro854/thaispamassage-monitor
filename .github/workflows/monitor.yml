name: Monitor de velocidad

on:
  schedule:
    - cron: '0 * * * *'      # cada hora, en punto (UTC)
  workflow_dispatch:          # permite lanzarlo a mano
    inputs:
      report:
        description: 'Enviar informe con el estado actual (aunque no haya alertas)'
        type: boolean
        default: false

# Evita que dos ejecuciones se solapen
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write             # para guardar el historial en el repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - run: npm ci

      - name: Medir y alertar
        env:
          SMTP_HOST:   ${{ secrets.SMTP_HOST }}
          SMTP_PORT:   ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER:   ${{ secrets.SMTP_USER }}
          SMTP_PASS:   ${{ secrets.SMTP_PASS }}
          SMTP_FROM:   ${{ secrets.SMTP_FROM }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node monitor.js ${{ (github.event_name == 'workflow_dispatch' && inputs.report) && '--report' || '' }}

      - name: Guardar historial
        if: always()
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "monitor: actualiza historial [skip ci]"
          git push || true
